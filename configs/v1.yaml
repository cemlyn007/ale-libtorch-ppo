total_environments: 4096
hidden_size: 512
horizon: 5
max_steps: 64800
frame_stack: 4
learning_rate: 0.00025
clip_param: 0.2
value_loss_coef: 0.4
entropy_coef: 0.01
num_epochs: 1
mini_batch_size: 1280
num_mini_batches: 16
shuffle_mini_batches: true
gae_discount: 0.99
gae_lambda: 0.95
max_gradient_norm: 0.5
num_rollouts: 1000000
# Hardware threads minus one, leaving a core for the main thread.
num_workers: 31
worker_batch_size: 8
frame_skip: 4
# Breakout max possible score.
max_return: 864
record_observation: false
record_video: true
cuda_graph: false
deterministic: true
# Save latest.pt every N rollouts and best.pt on return improvement; 0 disables.
checkpoint_interval: 1000
